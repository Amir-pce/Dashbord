<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحلیل و آمار | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="analytics">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>تحلیل و آمار</h1>
            <nav class="breadcrumb text-muted">داشبورد / تحلیل</nav>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-primary"><i class="fa-solid fa-chart-line"></i></div>
              <div><div class="stat-value">۶۸٪</div><div class="stat-label">نرخ تبدیل</div></div>
            </div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-success"><i class="fa-solid fa-clock"></i></div>
              <div><div class="stat-value">۳:۲۴</div><div class="stat-label">میانگین زمان</div></div>
            </div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-warning"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
              <div><div class="stat-value">۳۲٪</div><div class="stat-label">نرخ پرش</div></div>
            </div>
          </div>
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-info"><i class="fa-solid fa-globe"></i></div>
              <div><div class="stat-value">۲۴</div><div class="stat-label">کشورها</div></div>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-xl-7">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">بازدید هفتگی</div>
              <div style="height:320px;"><canvas id="visitsChart"></canvas></div>
            </div>
          </div>
          <div class="col-12 col-xl-5">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">دستگاه‌های کاربران</div>
              <div style="height:320px;"><canvas id="devicesChart"></canvas></div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12 col-xl-6">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">درآمد بر اساس دسته‌بندی</div>
              <div style="height:300px;"><canvas id="categoryChart"></canvas></div>
            </div>
          </div>
          <div class="col-12 col-xl-6">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">عملکرد فروش (رادار)</div>
              <div style="height:300px;"><canvas id="radarChart"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/analytics.js"></script>
  <script>DashAuth.guard();</script>
</body>
</html>
