<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش‌ها | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="orders">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>سفارش‌ها</h1>
            <nav class="breadcrumb text-muted">داشبورد / سفارش‌ها</nav>
          </div>
        </div>

        <ul class="nav nav-pills mb-3" id="order-tabs">
          <li class="nav-item"><button class="nav-link active" data-filter="">همه</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="active">تکمیل شده</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="pending">در انتظار</button></li>
          <li class="nav-item"><button class="nav-link" data-filter="inactive">لغو شده</button></li>
        </ul>

        <div class="card p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>شماره</th>
                  <th>مشتری</th>
                  <th>محصول</th>
                  <th>تاریخ</th>
                  <th>مبلغ</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="orders-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const orders = [
      { id: "۱۰۲۴", name: "مریم احمدی", img: 5, product: "لپ‌تاپ ایسوس", date: "۱۴۰۳/۰۳/۲۸", amount: "۲۴٬۵۰۰٬۰۰۰", status: "active", st: "تکمیل شده" },
      { id: "۱۰۲۳", name: "رضا کریمی", img: 13, product: "هدفون بی‌سیم", date: "۱۴۰۳/۰۳/۲۷", amount: "۱٬۲۰۰٬۰۰۰", status: "pending", st: "در انتظار" },
      { id: "۱۰۲۲", name: "سارا محمدی", img: 9, product: "ساعت هوشمند", date: "۱۴۰۳/۰۳/۲۷", amount: "۳٬۸۰۰٬۰۰۰", status: "active", st: "تکمیل شده" },
      { id: "۱۰۲۱", name: "امیر حسینی", img: 33, product: "موبایل سامسونگ", date: "۱۴۰۳/۰۳/۲۶", amount: "۱۸٬۰۰۰٬۰۰۰", status: "inactive", st: "لغو شده" },
      { id: "۱۰۲۰", name: "نگار رستمی", img: 21, product: "کیبورد مکانیکی", date: "۱۴۰۳/۰۳/۲۵", amount: "۲٬۱۰۰٬۰۰۰", status: "active", st: "تکمیل شده" },
      { id: "۱۰۱۹", name: "حسین قاسمی", img: 51, product: "مانیتور ال‌جی", date: "۱۴۰۳/۰۳/۲۴", amount: "۱۴٬۸۰۰٬۰۰۰", status: "pending", st: "در انتظار" },
    ];
    function render(filter) {
      let html = "";
      orders.filter(o => !filter || o.status === filter).forEach((o) => {
        html += `
          <tr>
            <td class="fw-semibold">#${o.id}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="https://i.pravatar.cc/80?img=${o.img}" class="avatar-sm" alt="">
                <span>${o.name}</span>
              </div>
            </td>
            <td>${o.product}</td>
            <td>${o.date}</td>
            <td>${o.amount} ﷼</td>
            <td><span class="status-pill status-${o.status}">${o.st}</span></td>
          </tr>`;
      });
      $("#orders-table").html(html || '<tr><td colspan="6" class="text-center text-muted py-4">سفارشی یافت نشد</td></tr>');
    }
    $(function () {
      render("");
      $("#order-tabs .nav-link").on("click", function () {
        $("#order-tabs .nav-link").removeClass("active");
        $(this).addClass("active");
        render($(this).data("filter"));
      });
    });
  </script>
  <script>DashAuth.guard();</script>
</body>
</html>
