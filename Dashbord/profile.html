<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>پروفایل من</h1>
            <nav class="breadcrumb text-muted">داشبورد / پروفایل</nav>
          </div>
        </div>

        <div class="row g-3">
          <!-- کارت پروفایل -->
          <div class="col-12 col-xl-4">
            <div class="card p-4 text-center">
              <img src="https://i.pravatar.cc/200?img=12" class="rounded-circle mx-auto mb-3" style="width:120px;height:120px;object-fit:cover;" alt="آواتار">
              <h5 class="fw-bold mb-1 user-display-name">امیرحسین دنیا</h5>
              <p class="text-muted mb-3">مدیر سیستم</p>
              <div class="d-flex justify-content-center gap-4 mb-3">
                <div><div class="fw-bold fs-5">۱۲۴</div><small class="text-muted">پروژه</small></div>
                <div><div class="fw-bold fs-5">۸٫۹ک</div><small class="text-muted">دنبال‌کننده</small></div>
                <div><div class="fw-bold fs-5">۳۲</div><small class="text-muted">تیم</small></div>
              </div>
              <button class="btn btn-primary w-100"><i class="fa-solid fa-camera ms-1"></i> تغییر عکس</button>
            </div>
          </div>

          <!-- فرم اطلاعات -->
          <div class="col-12 col-xl-8">
            <div class="card p-4">
              <h6 class="fw-bold mb-3">اطلاعات شخصی</h6>
              <form id="profile-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">نام</label>
                    <input type="text" class="form-control" value="امیرحسین" id="pf-first">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">نام خانوادگی</label>
                    <input type="text" class="form-control" value="دنیا" id="pf-last">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">ایمیل</label>
                    <input type="email" class="form-control" value="admin@panel.ir">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">تلفن</label>
                    <input type="text" class="form-control" value="09121234567" dir="ltr">
                  </div>
                  <div class="col-12">
                    <label class="form-label">درباره من</label>
                    <textarea class="form-control" rows="3"></textarea>
                  </div>
                </div>
                <div class="text-start mt-4">
                  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk ms-1"></i> ذخیره تغییرات</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script>
    $(function () {
      $("#profile-form").on("submit", function (e) {
        e.preventDefault();
        const name = $("#pf-first").val() + " " + $("#pf-last").val();
        const user = DashAuth.getUser() || {};
        user.name = name;
        DashAuth.login(user);
        $(".user-display-name").text(name);
        alert("تغییرات با موفقیت ذخیره شد ✓");
      });
    });
  </script>
  <script>DashAuth.guard();</script>
</body>
</html>
