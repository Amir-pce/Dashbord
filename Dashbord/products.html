<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>محصولات</h1>
            <nav class="breadcrumb text-muted">داشبورد / محصولات</nav>
          </div>
          <button class="btn btn-primary"><i class="fa-solid fa-plus ms-1"></i> افزودن محصول</button>
        </div>

        <div class="row g-3" id="products-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const products = [
      { name: "لپ‌تاپ ایسوس ROG", cat: "الکترونیک", price: "۴۲٬۰۰۰٬۰۰۰", stock: 12, rating: 4.8, icon: "fa-laptop", color: "bg-grad-primary" },
      { name: "هدفون سونی WH-1000", cat: "صوتی", price: "۸٬۵۰۰٬۰۰۰", stock: 34, rating: 4.9, icon: "fa-headphones", color: "bg-grad-info" },
      { name: "ساعت هوشمند اپل", cat: "پوشیدنی", price: "۱۸٬۲۰۰٬۰۰۰", stock: 7, rating: 4.7, icon: "fa-clock", color: "bg-grad-success" },
      { name: "موبایل سامسونگ S24", cat: "موبایل", price: "۳۶٬۰۰۰٬۰۰۰", stock: 0, rating: 4.6, icon: "fa-mobile-screen", color: "bg-grad-warning" },
      { name: "کیبورد مکانیکی", cat: "جانبی", price: "۲٬۱۰۰٬۰۰۰", stock: 56, rating: 4.5, icon: "fa-keyboard", color: "bg-grad-danger" },
      { name: "مانیتور ال‌جی 27", cat: "الکترونیک", price: "۱۴٬۸۰۰٬۰۰۰", stock: 18, rating: 4.8, icon: "fa-desktop", color: "bg-grad-primary" },
    ];
    $(function () {
      let html = "";
      products.forEach((p) => {
        const stockBadge = p.stock === 0
          ? '<span class="status-pill status-inactive">ناموجود</span>'
          : p.stock < 10
          ? `<span class="status-pill status-pending">${p.stock} عدد</span>`
          : `<span class="status-pill status-active">${p.stock} عدد</span>`;
        html += `
          <div class="col-12 col-sm-6 col-xl-4">
            <div class="card p-3 h-100">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div class="stat-icon ${p.color}" style="width:50px;height:50px;font-size:20px;border-radius:14px;">
                  <i class="fa-solid ${p.icon}"></i>
                </div>
                <span class="text-warning fw-semibold"><i class="fa-solid fa-star"></i> ${p.rating}</span>
              </div>
              <h6 class="fw-bold mb-1">${p.name}</h6>
              <small class="text-muted d-block mb-3">${p.cat}</small>
              <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold text-primary">${p.price} ﷼</span>
                ${stockBadge}
              </div>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-sm btn-light border flex-fill"><i class="fa-solid fa-pen ms-1 text-primary"></i> ویرایش</button>
                <button class="btn btn-sm btn-light border"><i class="fa-solid fa-trash text-danger"></i></button>
              </div>
            </div>
          </div>`;
      });
      $("#products-grid").html(html);
    });
  </script>
  <script>DashAuth.guard();</script>
</body>
</html>
