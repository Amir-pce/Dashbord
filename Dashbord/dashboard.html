<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <div class="app-wrapper">
    <!-- سایدبار -->
    <div id="sidebar-mount"></div>

    <div class="main-content">
      <!-- topbar -->
      <div id="topbar-mount"></div>

      <!-- محتوای صفحه -->
      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>سلام، <span class="welcome-name">کاربر</span> 👋</h1>
            <nav class="breadcrumb text-muted">امروز یک نمای کلی از کسب‌وکار شما</nav>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-light border"><i class="fa-solid fa-calendar ms-1"></i> این ماه</button>
            <button class="btn btn-primary"><i class="fa-solid fa-download ms-1"></i> گزارش</button>
          </div>
        </div>

        <!-- کارت‌های آماری -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-primary"><i class="fa-solid fa-dollar-sign"></i></div>
              <div>
                <div class="stat-value">۴۸۲ م</div>
                <div class="stat-label">درآمد کل</div>
                <div class="trend up"><i class="fa-solid fa-arrow-up"></i> ۱۲.۵٪</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-success"><i class="fa-solid fa-cart-shopping"></i></div>
              <div>
                <div class="stat-value">۱,۸۳۴</div>
                <div class="stat-label">سفارش‌ها</div>
                <div class="trend up"><i class="fa-solid fa-arrow-up"></i> ۸.۲٪</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-warning"><i class="fa-solid fa-users"></i></div>
              <div>
                <div class="stat-value">۹,۴۲۱</div>
                <div class="stat-label">کاربران</div>
                <div class="trend up"><i class="fa-solid fa-arrow-up"></i> ۴.۱٪</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon bg-grad-info"><i class="fa-solid fa-eye"></i></div>
              <div>
                <div class="stat-value">۳۲.۸ک</div>
                <div class="stat-label">بازدیدها</div>
                <div class="trend down"><i class="fa-solid fa-arrow-down"></i> ۲.۴٪</div>
              </div>
            </div>
          </div>
        </div>

        <!-- چارت‌ها -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-xl-8">
            <div class="card p-3 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="card-title">نمودار فروش و درآمد</span>
                <select class="form-select form-select-sm w-auto">
                  <option>۶ ماه اخیر</option>
                  <option>۱۲ ماه اخیر</option>
                </select>
              </div>
              <div style="height: 320px;"><canvas id="salesChart"></canvas></div>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">منابع ترافیک</div>
              <div style="height: 320px;"><canvas id="trafficChart"></canvas></div>
            </div>
          </div>
        </div>

        <!-- جدول سفارش‌های اخیر + فعالیت‌ها -->
        <div class="row g-3">
          <div class="col-12 col-xl-8">
            <div class="card p-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="card-title">سفارش‌های اخیر</span>
                <a href="orders.html" class="small text-decoration-none">مشاهده همه</a>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>مشتری</th>
                      <th>محصول</th>
                      <th>مبلغ</th>
                      <th>وضعیت</th>
                    </tr>
                  </thead>
                  <tbody id="recent-orders"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="card p-3 h-100">
              <div class="card-title mb-3">فعالیت‌های اخیر</div>
              <ul class="list-unstyled mb-0" id="activity-feed"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
  <script>DashAuth.guard();</script>
</body>
</html>
