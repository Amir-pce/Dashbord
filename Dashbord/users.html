<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاربران | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="users">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>مدیریت کاربران</h1>
            <nav class="breadcrumb text-muted">داشبورد / کاربران</nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="add-user-btn">
            <i class="fa-solid fa-plus ms-1"></i> کاربر جدید
          </button>
        </div>

        <div class="card p-3">
          <!-- نوار ابزار -->
          <div class="row g-2 mb-3 align-items-center">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-transparent"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" class="form-control" id="search-input" placeholder="جستجوی نام یا ایمیل...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filter-status">
                <option value="">همه وضعیت‌ها</option>
                <option value="active">فعال</option>
                <option value="pending">در انتظار</option>
                <option value="inactive">غیرفعال</option>
              </select>
            </div>
            <div class="col-md-4 text-md-start text-muted small">
              مجموع: <span id="total-count" class="fw-bold">0</span> کاربر
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>کاربر</th>
                  <th>نقش</th>
                  <th>تلفن</th>
                  <th>وضعیت</th>
                  <th class="text-start">عملیات</th>
                </tr>
              </thead>
              <tbody id="users-table">
                <tr><td colspan="5" class="text-center text-muted py-4">در حال بارگذاری...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- مودال افزودن/ویرایش کاربر -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0" style="border-radius:16px;">
        <form id="user-form">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="modal-title">کاربر جدید</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="user-id">
            <div class="mb-3">
              <label class="form-label">نام کامل</label>
              <input type="text" class="form-control" id="user-name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ایمیل</label>
              <input type="email" class="form-control" id="user-email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">تلفن</label>
              <input type="text" class="form-control" id="user-phone">
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label">نقش</label>
                <select class="form-select" id="user-role">
                  <option>مدیر</option>
                  <option>ویرایشگر</option>
                  <option selected>کاربر</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">وضعیت</label>
                <select class="form-select" id="user-status">
                  <option value="active">فعال</option>
                  <option value="pending">در انتظار</option>
                  <option value="inactive">غیرفعال</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-light border" data-bs-dismiss="modal">انصراف</button>
            <button type="submit" class="btn btn-primary" id="save-user-btn">ذخیره</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
  <script>DashAuth.guard();</script>
</body>
</html>
