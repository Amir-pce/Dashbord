<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="settings">
  <div class="app-wrapper">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-area">
        <div class="page-head">
          <div>
            <h1>تنظیمات</h1>
            <nav class="breadcrumb text-muted">داشبورد / تنظیمات</nav>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12 col-lg-3">
            <div class="card p-2">
              <div class="list-group list-group-flush" id="settings-tabs">
                <a class="list-group-item list-group-item-action border-0 rounded active" data-bs-toggle="list" href="#tab-general"><i class="fa-solid fa-sliders ms-2"></i> عمومی</a>
                <a class="list-group-item list-group-item-action border-0 rounded" data-bs-toggle="list" href="#tab-notif"><i class="fa-solid fa-bell ms-2"></i> اعلان‌ها</a>
                <a class="list-group-item list-group-item-action border-0 rounded" data-bs-toggle="list" href="#tab-security"><i class="fa-solid fa-shield-halved ms-2"></i> امنیت</a>
                <a class="list-group-item list-group-item-action border-0 rounded" data-bs-toggle="list" href="#tab-appearance"><i class="fa-solid fa-palette ms-2"></i> ظاهر</a>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-9">
            <div class="card p-4">
              <div class="tab-content">
                <!-- عمومی -->
                <div class="tab-pane fade show active" id="tab-general">
                  <h6 class="fw-bold mb-3">تنظیمات عمومی</h6>
                  <div class="mb-3">
                    <label class="form-label">نام سایت</label>
                    <input type="text" class="form-control" value="پنل مدیریت">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">زبان</label>
                    <select class="form-select"><option>فارسی</option><option>English</option></select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">منطقه زمانی</label>
                    <select class="form-select"><option>تهران (GMT+3:30)</option></select>
                  </div>
                </div>

                <!-- اعلان‌ها -->
                <div class="tab-pane fade" id="tab-notif">
                  <h6 class="fw-bold mb-3">تنظیمات اعلان</h6>
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked id="n1"><label class="form-check-label" for="n1">اعلان ایمیلی</label></div>
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked id="n2"><label class="form-check-label" for="n2">اعلان پیامکی</label></div>
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="n3"><label class="form-check-label" for="n3">اعلان مرورگر</label></div>
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked id="n4"><label class="form-check-label" for="n4">خبرنامه هفتگی</label></div>
                </div>

                <!-- امنیت -->
                <div class="tab-pane fade" id="tab-security">
                  <h6 class="fw-bold mb-3">امنیت</h6>
                  <div class="mb-3"><label class="form-label">رمز عبور فعلی</label><input type="password" class="form-control"></div>
                  <div class="mb-3"><label class="form-label">رمز عبور جدید</label><input type="password" class="form-control"></div>
                  <div class="mb-3"><label class="form-label">تکرار رمز جدید</label><input type="password" class="form-control"></div>
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="s2fa"><label class="form-check-label" for="s2fa">احراز هویت دو مرحله‌ای</label></div>
                </div>

                <!-- ظاهر -->
                <div class="tab-pane fade" id="tab-appearance">
                  <h6 class="fw-bold mb-3">ظاهر</h6>
                  <p class="text-muted">حالت نمایش را انتخاب کنید:</p>
                  <div class="d-flex gap-3">
                    <button class="btn btn-outline-secondary flex-fill py-3 theme-set" data-theme="light"><i class="fa-solid fa-sun d-block fs-4 mb-2"></i> روشن</button>
                    <button class="btn btn-outline-secondary flex-fill py-3 theme-set" data-theme="dark"><i class="fa-solid fa-moon d-block fs-4 mb-2"></i> تاریک</button>
                  </div>
                </div>
              </div>

              <div class="text-start mt-4 pt-3 border-top">
                <button class="btn btn-primary" id="save-settings"><i class="fa-solid fa-floppy-disk ms-1"></i> ذخیره</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/layout.js"></script>
  <script>
    $(function () {
      $(".theme-set").on("click", function () {
        const theme = $(this).data("theme");
        localStorage.setItem("dash-theme", theme);
        if (theme === "dark") $("body").addClass("dark-mode");
        else $("body").removeClass("dark-mode");
        $(document).trigger("themeChanged");
      });
      $("#save-settings").on("click", function () {
        alert("تنظیمات ذخیره شد ✓");
      });
    });
  </script>
  <script>DashAuth.guard();</script>
</body>
</html>
